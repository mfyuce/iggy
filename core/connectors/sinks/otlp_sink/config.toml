type = "sink"
key = "otlp"
enabled = true
version = 0
name = "OTLP sink"
path = "../../target/release/libiggy_connector_otlp_sink"
verbose = false

[[streams]]
stream = "otel"
topics = ["signals"]
schema = "json" # Use "raw" when format = "proto"
batch_length = 1000
poll_interval = "5ms"
consumer_group = "otlp_sink"

[plugin_config]
endpoint = "http://localhost:4317"
signal = "traces" # "traces", "metrics", or "logs"
# transport = "grpc" # "grpc" or "http"
# format = "json" # "json" or "proto"
# compression = false
# request_timeout = "30s"

# [plugin_config.headers]
# qw-otel-traces-index = "flows"
